# Verified Chili-patched USA/Europe ROM (2 MB, CRC32 405ed24b). Reset/IRQ vectors and stack are read directly from ROM.
# WRAM telemetry addresses remain unknown and disabled.
[game]
output_prefix = "wotes"
jump_table_autodiscovery = true

[ram_layout]
game_mode = 0
vint_runcount = 0
vint_routine = 0
plc_pending = 0
initial_ssp = 0x00FFFFF6
vbla_stack = 0x00FFFFF6
intr_stack = 0x00FFFFF6
player_object = 0
level_modes = []

[functions]
# $61EC is the installed VBlank callback. $21526 indexes four audited
# direction handlers (D3 = (facing & 3) * 4). Each adjusts A2 and joins
# $21538; the shared epilogue at $2158E restores the caller's MOVEM frame.
# $10384 likewise dispatches four movement directions to $10388 + 4*n;
# these adjust D0/D1 and join $10396 before the original shared epilogue.
extra = [0x000200, 0x0009E6, 0x0061EC, 0x02152A, 0x02152E, 0x021532, 0x021536,
         0x010388, 0x01038C, 0x010390, 0x010394,
         # Direction-indexed position updates: &3, then *4; shared tails.
         0x011664, 0x011668, 0x01166C, 0x011670,
         0x011DC8, 0x011DCC, 0x011DD0, 0x011DD4,
         0x011E32, 0x011E36, 0x011E3A, 0x011E3E,
         # $20022: facing &3, *4, adjacent-tile query; join $20034.
         0x020026, 0x02002A, 0x02002E, 0x020032,
         # $20130: direction bits $30 >>2, object movement; join $20142.
         0x020134, 0x020138, 0x02013C, 0x020140,
         # Other audited four-way adjacent-tile tables, same 4-byte stride:
         # $10680: (facing &3)*4; $2066E: (object flags &$30)>>2;
         # $21D8A: direction bits &$30, >>4, *4. Each joins after 14 bytes.
         0x010684, 0x010688, 0x01068C, 0x010690,
         0x020672, 0x020676, 0x02067A, 0x02067E,
         0x021D8E, 0x021D92, 0x021D96, 0x021D9A]
# Audited sound-command wrapper (LINK A6 at $1EDA6). Its nested helpers
# $1ED86/$1ED92 call $1ED24, which pops a return into A0 then pushes it
# back for RTS. The current capture-return emitter loses that continuation.
# Keep complete sound wrappers on the faithful fallback until emitter support.
# $1EFE2 and $1EF4E have the same audited nested return-capture pattern;
# strict checks exposed $16EB2->$1EFE2 and $1EF54->$1EDDA respectively.
# $10178C is a speculative discovery in the patch's all-zero ROM padding
# (all added nonzero content ends at $100DD7), not an instruction entry.
blacklist = [0x01EDA6, 0x01EFE2, 0x01EF4E, 0x10178C]

# Optional presentation skips. The original caller handles the carry flag
# exactly as it does when a player dismisses the introductory sequence.
[[widescreen_site]]
addr = 0x022468
kind = "game_hook"

[[widescreen_site]]
addr = 0x01675C
kind = "game_hook"

# Gravestone inscriptions: initialize the held-button edge latch before
# displaying text, then retain dismissal edges lost by repeated pad polling.
[[widescreen_site]]
addr = 0x00D784
kind = "game_hook"

[[widescreen_site]]
addr = 0x00D7AC
kind = "game_hook"

# Development ability scores: default template copy and custom roll completion.
[[widescreen_site]]
addr = 0x002516
kind = "game_hook"

[[widescreen_site]]
addr = 0x001800
kind = "game_hook"

# Preserve the readied action across equipment menus opened during targeting.
[[widescreen_site]]
addr = 0x003950
kind = "game_hook"

[[widescreen_site]]
addr = 0x003B68
kind = "game_hook"

[[widescreen_site]]
addr = 0x003D84
kind = "game_hook"

# Per-item floor art, before the original renderer's distance offsets.
[[widescreen_site]]
addr = 0x00BA70
kind = "game_hook"

[[widescreen_site]]
addr = 0x00BA80
kind = "game_hook"

[[widescreen_site]]
addr = 0x01FB60
kind = "game_hook"

# Reuse the same gauntlets icon throughout the pickup flight.
[[widescreen_site]]
addr = 0x021332
kind = "game_hook"

[[widescreen_site]]
addr = 0x0213B0
kind = "game_hook"
